<!DOCTYPE html>
<html>
<head>
    <title>Vision AI Lab</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="hero">
    <h1>Vision AI Lab</h1>
    <p>Explore AI-powered image understanding, object detection, and intelligent reasoning.</p>
</div>

<div class="card glass">
    <h2>Upload Image</h2>
    <p>Analyze objects, colors, and get AI insights.</p>

    <input type="file" id="fileInput">
    <button onclick="analyze()">Analyze</button>

    <div id="preview"></div>
    <div id="loadingOverlay" class="hidden">
        <div class="spinner"></div>
        <p>Analyzing image with AI...</p>
    </div>
</div>

<div id="results" class="card glass hidden">
    <h2>Results</h2>

    <h3>Detected Objects</h3>
    <div id="predictions"></div>

    <h3>Image Caption</h3>
    <p id="caption"></p>

    <h3>Dominant Color</h3>
    <div id="colorBox"></div>

    <h3>Similarity Insight</h3>
    <p id="comparison"></p>

    <h3>Ask AI</h3>
    <input type="text" id="question" placeholder="Ask about the image...">
    <button onclick="askAI()">Ask</button>

    <div id="chat"></div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
